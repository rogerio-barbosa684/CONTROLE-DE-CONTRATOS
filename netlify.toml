[build]
  command = "npm install"
  functions = "netlify/functions"
  publish = "."
  environment = { NODE_VERSION = "22" }

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200

# Bloqueia arquivos sensiveis que nao podem ser servidos como estatico
[[redirects]]
  from = "/*.py"
  to = "/404"
  status = 404

[[redirects]]
  from = "/*.db"
  to = "/404"
  status = 404

[[redirects]]
  from = "/*.pem"
  to = "/404"
  status = 404

[[redirects]]
  from = "/*.key"
  to = "/404"
  status = 404

[[redirects]]
  from = "/config_email.json"
  to = "/404"
  status = 404

[[redirects]]
  from = "/dados.json"
  to = "/404"
  status = 404

[[redirects]]
  from = "/backup_supabase.js"
  to = "/404"
  status = 404

[[redirects]]
  from = "/api.js"
  to = "/404"
  status = 404

[[redirects]]
  from = "/deploy-setup.js"
  to = "/404"
  status = 404

[[redirects]]
  from = "/migrate.js"
  to = "/404"
  status = 404

[[redirects]]
  from = "/test_login.mjs"
  to = "/404"
  status = 404

[[redirects]]
  from = "/email-diario.js"
  to = "/404"
  status = 404

[[redirects]]
  from = "/admin_initial_password.txt"
  to = "/404"
  status = 404

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://*.supabase.co"
